<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VRTX Checker — kalkulator zużycia VRAM dla lokalnych modeli AI (LLM). Poprawna formuła KV cache z uwzględnieniem GQA, okien przesuwnych i MoE, kwantyzacja wag, narzuty systemowe.">
<meta name="color-scheme" content="light dark">
<title>VRTX Checker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2376b900'/><rect x='7' y='11' width='18' height='10' rx='2' fill='%230f172a'/></svg>">
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --card-2:#f8fafc; --panel:#0f172a;
  --ink:#0f172a; --ink-2:#334155; --muted:#5b6b7f;
  --line:#e2e8f0; --line-2:#cbd5e1;
  --nv:#76b900; --nv-text:#3f6600;
  --ok:#065f46; --ok-bg:#d1fae5; --ok-line:#6ee7b7;
  --warn:#92400e; --warn-bg:#fef3c7; --warn-line:#fcd34d;
  --bad:#991b1b; --bad-bg:#fee2e2; --bad-line:#fca5a5;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.07);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#070c16; --card:#111a2b; --card-2:#0d1524; --panel:#0a1120;
    --ink:#e8eef7; --ink-2:#c3cede; --muted:#93a3b8;
    --line:#22304a; --line-2:#2e3f5e;
    --nv:#76b900; --nv-text:#9ede2a;
    --ok:#6ee7b7; --ok-bg:#04352a; --ok-line:#0f6b52;
    --warn:#fcd34d; --warn-bg:#3a2a05; --warn-line:#8a6407;
    --bad:#fca5a5; --bad-bg:#3d1213; --bad-line:#8c2a2c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
/* reguły display: na klasach biją domyślne [hidden]{display:none} przeglądarki */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding:16px;
}
@media(min-width:900px){ body{padding:28px} }
.wrap{max-width:1180px;margin:0 auto}
.app{
  background:var(--card); border:1px solid var(--line); border-radius:24px;
  box-shadow:var(--shadow); display:grid; grid-template-columns:1fr;
  /* clip zamiast hidden — przycina rogi, ale nie tworzy kontekstu przewijania,
     dzięki czemu position:sticky w kolumnie wyników nadal działa */
  overflow:clip;
}
@media(min-width:1000px){ .app{grid-template-columns:1.25fr 1fr} }
.col-a{padding:22px;border-bottom:1px solid var(--line);min-width:0}
.col-b{padding:22px;background:var(--card-2);min-width:0}
@media(min-width:1000px){ .col-a{border-bottom:0;border-right:1px solid var(--line)} }

h1{font-size:22px;line-height:1.2;font-weight:800;margin:0;letter-spacing:-.02em}
@media(min-width:700px){ h1{font-size:26px} }
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 8px}
h3{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--ink-2)}
p{margin:0}
.lede{color:var(--muted);font-size:13px;margin:10px 0 18px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
/* ikona karty graficznej — kolory z currentColor, więc sama dopasowuje się do motywu */
.gpu{width:52px;height:34px;flex:none;color:var(--ink);overflow:visible;
  filter:drop-shadow(0 1px 8px color-mix(in srgb, var(--nv) 45%, transparent))}
@media(min-width:700px){ .gpu{width:58px;height:38px} }
.gpu-body{fill:color-mix(in srgb, currentColor 10%, transparent);
  stroke:color-mix(in srgb, currentColor 52%, transparent);stroke-width:1.3}
.gpu-edge{fill:color-mix(in srgb, currentColor 34%, transparent)}
.gpu-pins{fill:color-mix(in srgb, currentColor 28%, transparent)}
.gpu-slot{fill:var(--card)}
.col-a .gpu-slot{fill:var(--card)}
.gpu-fan{fill:none;stroke:var(--nv);stroke-width:1.35}
.gpu-hub{fill:var(--nv)}
.gpu-led{fill:var(--nv);opacity:.9}
.gpu-blade{fill:none;stroke:var(--nv);stroke-width:1.05;stroke-linecap:round;opacity:.7}
.gpu-blades{transform-box:view-box;animation:gpu-spin 9s linear infinite}
@keyframes gpu-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .gpu-blades{animation:none} }
.chip{
  background:var(--panel);color:var(--nv);border:1px solid var(--line-2);
  padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
}
@media (prefers-color-scheme: dark){ .chip{border-color:#243350} }

/* przelacznik jezyka — dwa przyciski jako jedna pigulka */
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--card)}
@media (prefers-color-scheme: dark){ .lang{border-color:#243350} }
.lang button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font:800 11px/1 inherit;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:6px 11px;transition:background .15s,color .15s;
}
@media (prefers-reduced-motion: reduce){ .lang button{transition:none} }
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--nv);color:#0f172a}
.lang button:focus-visible{outline:2px solid var(--nv);outline-offset:-2px}
.head-right{display:flex;align-items:center;gap:9px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.col-a .card{background:var(--card-2)}
/* Suma zostaje w polu widzenia, gdy lista modeli jest dłuższa niż ekran.
   Przypinamy tylko tę jedną kartę — jest niska, więc nic nie staje się nieosiągalne. */
@media(min-width:1000px){
  .card-total{position:sticky;top:22px;z-index:2;
    box-shadow:0 4px 16px color-mix(in srgb, var(--ink) 7%, transparent)}
}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f > span.lbl{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],select{
  width:100%; min-width:0; background:var(--card); color:var(--ink);
  border:1px solid var(--line-2); border-radius:10px; padding:8px 10px;
  font-size:13px; font-weight:500; outline:none; transition:border-color .15s, box-shadow .15s;
}
select{appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{
  border-color:var(--nv); box-shadow:0 0 0 3px color-mix(in srgb, var(--nv) 28%, transparent);
}

.btn{cursor:pointer;border-radius:12px;border:1px solid var(--line-2);background:var(--card);
  color:var(--ink-2);padding:9px 14px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--nv);color:var(--nv-text)}
.btn.add{width:100%;border-style:dashed;padding:12px;margin-top:4px}
.btn.ghost{padding:6px 10px;font-size:12px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* Kolor karty odpowiada segmentowi na pasku alokacji i wierszowi w tabeli —
   --accent ustawia renderModels() z tej samej palety, co wykres. */
.model{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 14px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.model::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent,var(--line-2))}
.model .sw{vertical-align:baseline;margin-right:6px}
.model > header{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.model > header label.f{flex:1;min-width:0}
.del{flex:none;cursor:pointer;background:transparent;border:1px solid transparent;border-radius:9px;
  width:32px;height:32px;color:var(--muted);font-size:15px;line-height:1;transition:.15s}
.del:hover{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.del[hidden]{display:none}
details{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px}
summary{cursor:pointer;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px;border-radius:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"\25B8";transition:transform .15s;display:inline-block}
details[open] summary::before{transform:rotate(90deg)}
details .grid{margin-top:8px}
.grp{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);margin-top:14px;opacity:.85}
.grp:first-of-type{margin-top:12px}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}
.hint code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:11px;border:1px solid var(--line)}
.mini{font-size:11.5px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.mini b{color:var(--ink-2);font-weight:700}
/* Lista rośnie swobodnie — przewija się cała strona, nie kontener.
   Wcześniejszy limit wysokości ucinał karty, zostawiając pustą kolumnę pod spodem. */

.panel{background:var(--panel);border-radius:var(--radius);padding:15px;margin-bottom:16px;border:1px solid var(--line-2)}
@media (prefers-color-scheme: dark){ .panel{border-color:#243350} }
.panel h3{color:var(--nv);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.panel p{color:#94a3b8;font-size:11.5px;line-height:1.5}
.panel .grid{margin-top:12px}
.panel label.f{color:#94a3b8}
.panel input,.panel select{background:#1b2740;border-color:#2b3a57;color:#e8eef7}
@media (prefers-color-scheme: dark){ .panel input,.panel select{background:#16223a} }
/* legenda ustawień — panel jest ciemny w obu motywach, więc kolory są wpisane wprost */
.panel details{border-top:1px dashed #2b3a57;margin-top:15px;padding-top:11px}
.panel summary{color:#94a3b8}
.panel summary:hover{color:var(--nv)}
.panel .hint{color:#94a3b8}
.panel .hint strong{color:#dbe6f3}
.panel .hint em{color:var(--nv);font-style:normal;font-weight:700}
.panel .hint code{background:#1b2740;border-color:#2b3a57;color:#cbd5e1}
/* ostrzeżenie o braku sprzętowego FP8 — panel jest ciemny w obu motywach */
.panel .alert{display:flex;gap:9px;align-items:flex-start;margin:13px 0 0;padding:10px 12px;
  border:1px solid #8a6407;background:#3a2a05;border-radius:11px;font-size:11.5px;
  line-height:1.55;color:#fde3a0}
.panel .alert strong{color:#fcd34d}
.panel .alert code{background:#241a04;border-color:#5f4506;color:#fde3a0}
.panel .alert .ico{flex:none;font-size:13px;line-height:1.35}

.total{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:4px 0 12px}
.total .n{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.total .d{font-size:17px;font-weight:600;color:var(--muted)}
.n.ok{color:var(--ok)} .n.warn{color:var(--warn)} .n.bad{color:var(--bad)}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}

.bar{position:relative;display:flex;height:34px;border-radius:9px;overflow:hidden;
  background:var(--bg);border:1px solid var(--line);margin-bottom:6px}
.bar .seg{height:100%;min-width:0;transition:width .25s ease}
@media (prefers-reduced-motion: reduce){ .bar .seg{transition:none} }
.bar .limit{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 0 1px var(--card)}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-bottom:14px}

table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
caption{text-align:left;font-size:11px;color:var(--muted);padding-bottom:8px}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:800;border-top:2px solid var(--line-2);border-bottom:0;padding-top:9px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
td.name{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table-wrap{overflow-x:auto}

.note{font-size:11.5px;color:var(--muted);line-height:1.6}
.note strong{color:var(--ink-2)}
.note ul{margin:6px 0 0;padding-left:18px}
.note li{margin-bottom:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="wrap">
<main class="app">

  <!-- ===================== KONFIGURACJA ===================== -->
  <section class="col-a" aria-labelledby="t-cfg">
    <div class="head">
      <div class="brand">
        <svg class="gpu" viewBox="0 0 46 30" aria-hidden="true" focusable="false">
          <!-- śledź montażowy ze szczeliną wylotu powietrza -->
          <path class="gpu-edge" d="M2.2 2.4h3.4v25.2H2.2a1 1 0 0 1-1-1V3.4a1 1 0 0 1 1-1Z"/>
          <rect class="gpu-slot" x="2.9" y="8.4" width="1.9" height="13.2" rx=".95"/>
          <!-- złącze krawędziowe PCIe -->
          <path class="gpu-pins" d="M12.2 22h4.8v3.9h-4.8zM19 22h9.4v3.9H19z"/>
          <!-- korpus karty -->
          <rect class="gpu-body" x="5.1" y="3.9" width="39.4" height="19.2" rx="3.2"/>
          <!-- dioda / akcent -->
          <rect class="gpu-led" x="40.4" y="6.6" width="1.7" height="13.8" rx=".85"/>
          <!-- wentylator lewy -->
          <circle class="gpu-fan" cx="15.6" cy="13.5" r="5.6"/>
          <g class="gpu-blades" style="transform-origin:15.6px 13.5px">
            <path class="gpu-blade" d="M19.1 13.5A3.5 3.5 0 0 1 16.21 16.95"/>
            <path class="gpu-blade" d="M13.85 16.53A3.5 3.5 0 0 1 12.31 12.30"/>
            <path class="gpu-blade" d="M13.85 10.47A3.5 3.5 0 0 1 18.28 11.25"/>
          </g>
          <circle class="gpu-hub" cx="15.6" cy="13.5" r="1.55"/>
          <!-- wentylator prawy -->
          <circle class="gpu-fan" cx="33.4" cy="13.5" r="5.6"/>
          <g class="gpu-blades" style="transform-origin:33.4px 13.5px">
            <path class="gpu-blade" d="M36.9 13.5A3.5 3.5 0 0 1 34.01 16.95"/>
            <path class="gpu-blade" d="M31.65 16.53A3.5 3.5 0 0 1 30.11 12.30"/>
            <path class="gpu-blade" d="M31.65 10.47A3.5 3.5 0 0 1 36.08 11.25"/>
          </g>
          <circle class="gpu-hub" cx="33.4" cy="13.5" r="1.55"/>
        </svg>
        <h1 id="t-cfg">VRTX Checker</h1>
      </div>
      <div class="head-right">
        <div class="lang" id="lang" role="group" aria-label="Language / Język">
          <button type="button" data-lang="pl" aria-pressed="true" lang="pl">PL</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <span class="chip" id="chip-gpu">32 GiB</span>
      </div>
    </div>
    <p class="lede" data-i18n="lede"></p>

    <div class="panel">
      <h3 data-i18n="g.title"></h3>
      <p data-i18n-html="h.g.intro"></p>
      <div class="grid">
        <label class="f"><span class="lbl" data-i18n="g.kvPrec"></span>
          <select id="kv-prec"></select></label>
        <label class="f"><span class="lbl" data-i18n="g.os"></span>
          <select id="os-preset">
            <option value="0" data-i18n="g.os.0"></option>
            <option value="0.2" data-i18n="g.os.02"></option>
            <option value="0.6" data-i18n="g.os.06"></option>
            <option value="1.5" data-i18n="g.os.15"></option>
          </select></label>
        <label class="f"><span class="lbl" data-i18n="g.proc"></span>
          <input type="number" id="proc-ov" min="0" max="4" step="0.1" value="0.6"
                 data-i18n-title="g.proc.title"></label>
        <label class="f"><span class="lbl" data-i18n="g.frag"></span>
          <select id="frag">
            <option value="0" data-i18n="g.frag.0"></option>
            <option value="0.05" data-i18n="g.frag.5"></option>
            <option value="0.1" data-i18n="g.frag.10"></option>
          </select></label>
      </div>

      <p class="alert" id="kv-warn" role="status" hidden></p>

      <details>
        <summary data-i18n="g.expl"></summary>
        <p class="hint" data-i18n-html="h.g.explKv"></p>
        <p class="hint" data-i18n-html="h.g.explOs"></p>
        <p class="hint" data-i18n-html="h.g.explProc"></p>
        <p class="hint" data-i18n-html="h.g.explFrag"></p>
        <p class="hint" data-i18n-html="h.g.explMeasure"></p>
      </details>
    </div>

    <h2 data-i18n="m.title"></h2>
    <div id="models"></div>
    <button class="btn add" type="button" id="add" data-i18n="m.add"></button>
    <div class="row-btns">
      <button class="btn ghost" type="button" id="reset" data-i18n="m.reset"></button>
      <button class="btn ghost" type="button" id="copy" data-i18n="m.copy"></button>
      <span class="mini" id="saved" role="status" style="margin:0"></span>
    </div>
  </section>

  <!-- ===================== WYNIKI ===================== -->
  <section class="col-b" aria-labelledby="t-res">
    <h2 id="t-res" data-i18n="r.title"></h2>

    <div class="card card-total">
      <div class="total">
        <span class="n ok" id="total">0,0</span>
        <span class="d">/ <span id="limit">32</span> GiB</span>
      </div>
      <div aria-live="polite"><span class="badge ok" id="badge">—</span></div>
    </div>

    <div class="card">
      <h3 data-i18n="r.alloc"></h3>
      <div class="bar" id="bar" role="img" aria-labelledby="bar-alt"></div>
      <div class="scale"><span>0</span><span id="scale-max">32 GiB</span></div>
      <p id="bar-alt" class="sr"></p>
      <div class="table-wrap">
        <table>
          <caption data-i18n="r.caption"></caption>
          <thead>
            <tr><th scope="col" data-i18n="r.th.comp"></th><th scope="col" data-i18n="r.th.w"></th><th scope="col" data-i18n="r.th.kv"></th><th scope="col" data-i18n="r.th.over"></th><th scope="col" data-i18n="r.th.total"></th><th scope="col" data-i18n="r.th.tps"></th></tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot><tr><td data-i18n="r.tf.total"></td><td id="f-w"></td><td id="f-k"></td><td id="f-o"></td><td id="f-t"></td><td></td></tr></tfoot>
        </table>
      </div>
    </div>

    <div class="card">
      <h3 data-i18n="r.gpuCard"></h3>
      <label class="f"><span class="lbl" data-i18n="r.gpuModel"></span><select id="gpu"></select></label>
      <label class="f" id="custom-wrap" hidden style="margin-top:12px">
        <span class="lbl" data-i18n="r.customVram"></span>
        <input type="number" id="custom-vram" min="1" max="1024" step="1" value="32"></label>
      <p class="hint" id="gpu-info" style="margin-top:11px"></p>
    </div>

    <div class="card">
      <h3 data-i18n="r.how"></h3>
      <p class="note" data-i18n-html="h.r.how1"></p>
      <p class="note" style="margin-top:9px" data-i18n-html="h.r.how2"></p>
      <p class="note" style="margin-top:9px" data-i18n-html="h.r.howNot"></p>
      <ul class="note" data-i18n-html="h.r.howList"></ul>
    </div>

  // KV cache w GiB. Mnożnik 2 = klucze + wartości.
  // Warstwy z uwagą globalną trzymają cache dla całego kontekstu; warstwy z uwagą
  // lokalną (sliding window) tylko dla min(kontekst, okno) — to od Gemmy 3 i gpt-oss
  // decyduje o wyniku bardziej niż cokolwiek innego.
  // Encoder (embedding / reranker) nie generuje autoregresywnie, więc cache'u nie ma.
  // Precyzja KV cache realnie obowiązująca dany model: własne nadpisanie
  // (--cache-type-k w llama.cpp / --kv-cache-dtype w vLLM ustawia się per proces),
  // a gdy go nie ma — wartość globalna.
  function effKvBits(m) {

  function kvGiB(m, kvBits) {
    if (m.role === "encoder") return 0;

    var local = 2 * m.localLayers * m.localKvHeads * m.headDim * Math.min(m.context, m.window) * b;
    return (glob + local) / GIB;
  }
  function weightsGiB(m) {
    var mul = QUANT[m.quant] ? QUANT[m.quant].mul : QUANT.Q4_K_M.mul;
    return (m.params * mul * GB) / GIB;
  }
  // Generowanie pojedynczego strumienia jest ograniczone przepustowością pamięci:
  // na każdy token trzeba odczytać wagi. W MoE czyta się tylko aktywnych ekspertów,
  // więc o prędkości decydują parametry aktywne, a o zajętości VRAM — wszystkie.
  function tokensPerSec(m, bw) {
    if (!bw) return null;
    var effParams = m.activeParams > 0 ? m.activeParams : m.params;
    var mul = QUANT[m.quant] ? QUANT[m.quant].mul : QUANT.Q4_K_M.mul;
    var readGB = effParams * mul;
    if (readGB <= 0) return null;
    return (bw * BW_EFF) / readGB;
  }

  function gpu() {
    var g = GPUS.filter(function (x) { return x.id === S.gpu; })[0] || GPUS[0];
    return { id: g.id, name: g.name, bw: g.bw, arch: g.arch,
             vram: g.id === "custom" ? S.customVram : g.vram };
  }

  function compute() {
    var g = gpu();
    var rows = S.models.map(function (m, i) {
      var bits = effKvBits(m);
      var w = weightsGiB(m), k = kvGiB(m, bits);
      return {
        m: m, color: COLORS[i % COLORS.length],
        weights: w, kv: k, over: S.proc, total: w + k + S.proc,
        kvBits: bits, kvInherited: !(KV_BITS.indexOf(m.kvBits) >= 0),
        tps: m.role === "encoder" ? null : tokensPerSec(m, g.bw)
      };
    });
    var sub = rows.reduce(function (a, r) { return a + r.total; }, S.os);
    var frag = sub * S.frag;
    return { g: g, rows: rows, os: S.os, frag: frag, total: sub + frag };
  }

  /* ============ render: lista modeli ============ */

  var tpl = $("tpl");

  function renderModels() {
    var box = $("models");
    var scroll = box.scrollTop;
    box.textContent = "";

    S.models.forEach(function (m, i) {
      var node = tpl.content.firstElementChild.cloneNode(true);
      node.dataset.id = String(m.id);
      applyI18nIn(node);

      // ten sam indeks palety, którego compute() użyje dla paska i tabeli
      var accent = COLORS[i % COLORS.length];
      node.style.setProperty("--accent", accent);
      node.querySelector("[data-role=swatch]").style.background = accent;

      // Wartości ustawiane przez .value, nie przez interpolację do HTML —
      // dzięki temu nie ma w ogóle ścieżki wstrzyknięcia znaczników.
      node.querySelector("[data-f=name]").value = m.name;

      var pre = node.querySelector("[data-f=preset]");
      var groups = {};
      PRESETS.forEach(function (p) {
        var target = pre;
        if (p.group) {
          if (!groups[p.group]) {
            groups[p.group] = document.createElement("optgroup");
            groups[p.group].label = t("grp." + p.group);
            pre.appendChild(groups[p.group]);
          }
          target = groups[p.group];
        }
        target.appendChild(new Option(presetName(p), p.id, false, p.id === m.preset));
      });

      var qn = node.querySelector("[data-f=quant]");
      Object.keys(QUANT).forEach(function (k) { qn.appendChild(new Option(t("quant." + k), k, false, k === m.quant)); });

      // Pierwsza pozycja dziedziczy ustawienie globalne i pokazuje jego bieżącą
      // wartość, żeby było widać, co model faktycznie dostanie.
      var kv = node.querySelector("[data-f=kvBits]");
      kv.appendChild(new Option(t("kv.inherit", kvLabel(S.kvBits)), "0", false, !(KV_BITS.indexOf(m.kvBits) >= 0)));
      KV_PREC.forEach(function (p) {
        kv.appendChild(new Option(t("kv." + p.bits), String(p.bits), false, p.bits === m.kvBits));
      });

      var cx = node.querySelector("[data-f=context]");
      CONTEXTS.forEach(function (c) {
        cx.appendChild(new Option(t("ctx.tokens", c / 1024), String(c), false, c === m.context));
      });

      ["params", "activeParams", "fullLayers", "kvHeads", "headDim",
       "localLayers", "localKvHeads", "window"].forEach(function (f) {
        node.querySelector("[data-f=" + f + "]").value = m[f];
      });
      node.querySelector("[data-f=role]").value = m.role;
      node.querySelector("[data-act=del]").hidden = S.models.length <= 1;

      box.appendChild(node);
    });

    box.scrollTop = scroll;
  }

  function renderSummaries(r) {
    r.rows.forEach(function (row) {
      var node = $("models").querySelector('[data-id="' + row.m.id + '"]');
      if (!node) return;
      var parts = [t("sum.w", fmt(row.weights))];
      parts.push(t("sum.kv", row.m.role === "encoder"
        ? "—"
        : fmt(row.kv) + " GiB @ " + kvLabel(row.kvBits) + (row.kvInherited ? "" : t("kv.own"))));
      parts.push(t("sum.total", fmt(row.total)));
      if (row.tps) parts.push(t("sum.tps", Math.round(row.tps)));
      if (row.m.activeParams > 0) parts.push(t("sum.moe", numStr(row.m.activeParams)));
      if (row.m.localLayers > 0) parts.push(t("sum.window", row.m.window));
      node.querySelector("[data-role=sum]").textContent = parts.join(" · ");
    });
  }

  /* ============ render: wyniki ============ */

  function rgba(hex, a) {
    return "rgba(" + parseInt(hex.slice(1, 3), 16) + "," + parseInt(hex.slice(3, 5), 16) +
           "," + parseInt(hex.slice(5, 7), 16) + "," + a + ")";
  }

  function cell(text, color) {
    var td = document.createElement("td");
    if (color) {
      td.className = "name";
      var s = document.createElement("span");
      s.className = "sw"; s.style.background = color;
      td.appendChild(s);
      td.appendChild(document.createTextNode(text));
      td.title = text;
    } else { td.textContent = text; }
    return td;
  }

  var ARCH_NAME = { ampere: "Ampere", ada: "Ada Lovelace", blackwell: "Blackwell" };

  // FP8 dla KV cache to format sprzętowy — mają go dopiero Ada i Blackwell.
  // Na Ampere 8-bitowy cache jest osiągalny wyłącznie programowo (q8_0), więc
  // wynik z kalkulatora jest realny, ale okupiony narzutem na (de)kwantyzację.
  // 4 bity pomijamy: q4_0 to zawsze kwantyzacja programowa, działa na każdej karcie.
  function renderKvWarning(r) {
    var el = $("kv-warn");
    el.textContent = "";
    var arch = r.g.arch;
    if (!arch || FP8_ARCH[arch]) { el.hidden = true; return; }

    var hit = r.rows.filter(function (row) {
      return row.m.role !== "encoder" && row.kvBits === 8;
    });
    if (!hit.length) { el.hidden = true; return; }

    var ico = document.createElement("span");
    ico.className = "ico"; ico.textContent = "⚠";
    var body = document.createElement("span");

    function txt(s) { body.appendChild(document.createTextNode(s)); }
    function bold(s) { var b = document.createElement("strong"); b.textContent = s; body.appendChild(b); }
    function code(s) { var c = document.createElement("code"); c.textContent = s; body.appendChild(c); }

    bold(gpuName(r.g).replace(/\s*\(.*\)\s*/, ""));
    txt(t("warn.a", ARCH_NAME[arch] || arch));
    code("--cache-type-k q8_0");
    txt(t("warn.b"));
    code("--kv-cache-dtype fp8");
    txt(t("warn.c"));
    bold(hit.map(function (row) { return row.m.name; }).join(", ") + ".");

    el.appendChild(ico);
    el.appendChild(body);
    el.hidden = false;
  }

  function renderResults() {
    var r = compute(), g = r.g, limit = g.vram;

    $("limit").textContent = fmtLimit(limit);
    $("chip-gpu").textContent = fmtLimit(limit) + " GiB";

    // --- licznik i status (tekst pochodzi z realnie wybranej karty) ---
    var pct = limit > 0 ? r.total / limit : 99;
    var cls = pct > 1 ? "bad" : (pct > 0.85 ? "warn" : "ok");
    var short = g.id === "custom" ? "limit własny" : g.name.replace(/\s*\(.*\)\s*/, "");
    $("total").textContent = fmt(r.total, 1);
    $("total").className = "n " + cls;
    var b = $("badge");
    b.className = "badge " + cls;
    if (cls === "bad")       b.textContent = t("badge.over", fmt(r.total - limit, 1), short);
    else if (cls === "warn") b.textContent = t("badge.warn", Math.round(pct * 100), short);
    else                     b.textContent = t("badge.ok", fmtLimit(limit), short);

    // --- pasek alokacji ---
    var max = Math.max(limit, r.total);
    var bar = $("bar");
    bar.textContent = "";
    var segs = [{ l: t("bar.os"), v: r.os, c: "#94a3b8" }];
    r.rows.forEach(function (row) {
      segs.push({ l: t("bar.w", row.m.name), v: row.weights, c: row.color });
      if (row.kv > 0)   segs.push({ l: t("bar.kv", row.m.name), v: row.kv, c: rgba(row.color, 0.45) });
      if (row.over > 0) segs.push({ l: t("bar.proc", row.m.name), v: row.over, c: rgba(row.color, 0.2) });
    });
    if (r.frag > 0) segs.push({ l: t("bar.frag"), v: r.frag, c: "#cbd5e1" });
    segs.forEach(function (s) {
      if (s.v <= 0) return;
      var d = document.createElement("div");
      d.className = "seg";
      d.style.width = (s.v / max * 100) + "%";
      d.style.background = s.c;
      d.title = s.l + ": " + fmt(s.v) + " GiB";
      bar.appendChild(d);
    });
    if (limit < max) {
      var mark = document.createElement("div");
      mark.className = "limit";
      mark.style.left = (limit / max * 100) + "%";
      mark.title = t("bar.limit", fmtLimit(limit));
      bar.appendChild(mark);
    }
    $("scale-max").textContent = fmt(max, 0) + " GiB";
    $("bar-alt").textContent = t("bar.alt", fmt(r.total, 1), fmtLimit(limit), Math.round(pct * 100));

    // --- tabela rozbicia (dostępna alternatywa dla paska) ---
    var tb = $("tbody");
    tb.textContent = "";
    function addRow(label, color, w, k, o, t, tps) {
      var row = document.createElement("tr");
      row.appendChild(cell(label, color));
      [w, k, o, t, tps].forEach(function (v) { row.appendChild(cell(v)); });
      tb.appendChild(row);
    }
    addRow(t("bar.os"), "#94a3b8", "—", "—", fmt(r.os), fmt(r.os), "—");
    r.rows.forEach(function (row) {
      addRow(row.m.name, row.color, fmt(row.weights),
        row.m.role === "encoder" ? "—" : fmt(row.kv),
        fmt(row.over), fmt(row.total),
        row.tps ? "~" + Math.round(row.tps) : "—");
    });
    if (r.frag > 0) addRow(t("tbl.frag", Math.round(S.frag * 100)), "#cbd5e1", "—", "—", fmt(r.frag), fmt(r.frag), "—");

    var tw = r.rows.reduce(function (a, x) { return a + x.weights; }, 0);
    var tk = r.rows.reduce(function (a, x) { return a + x.kv; }, 0);
    var to = r.rows.reduce(function (a, x) { return a + x.over; }, 0) + r.os + r.frag;
    $("f-w").textContent = fmt(tw);
    $("f-k").textContent = fmt(tk);
    $("f-o").textContent = fmt(to);
    $("f-t").textContent = fmt(r.total);

    $("gpu-info").textContent = g.bw
      ? t("gpu.info", g.bw, Math.round(BW_EFF * 100))
      : t("gpu.infoNone");

    renderKvWarning(r);
    renderSummaries(r);
  }

  function refresh() { renderResults(); save(); }

  /* ============ zdarzenia: lista modeli ============ */

  function findModel(el) {
    var host = el.closest("[data-id]");
    if (!host) return null;
    var id = parseInt(host.dataset.id, 10);
    return S.models.filter(function (m) { return m.id === id; })[0] || null;
  }
  function markManual(el) {
    var host = el.closest("[data-id]");
    if (host) host.querySelector("[data-f=preset]").value = "manual";
  }

  var NUM_LIMITS = {
    params: [0.05, 3000, false], activeParams: [0, 3000, false],
    fullLayers: [0, 256, true], kvHeads: [1, 256, true], headDim: [8, 1024, true],
    localLayers: [0, 256, true], localKvHeads: [1, 256, true], window: [64, 131072, true]
  };

  // input → licz na bieżąco, ale nie nadpisuj tego, co użytkownik właśnie pisze
  $("models").addEventListener("input", function (e) {
    var f = e.target.dataset.f, m = findModel(e.target);
    if (!f || !m) return;
    if (f === "name") { m.name = e.target.value; refresh(); return; }
    var lim = NUM_LIMITS[f];
    if (!lim) return;
    var v = clamp(num(e.target.value, m[f]), lim[0], lim[1]);
    m[f] = lim[2] ? Math.round(v) : v;
    m.preset = "manual";
    markManual(e.target);
    refresh();
  });

  // change → normalizacja po opuszczeniu pola (puste / poza zakresem wraca do stanu)
  $("models").addEventListener("change", function (e) {
    var f = e.target.dataset.f, m = findModel(e.target);
    if (!f || !m) return;
    if (f === "quant")        { m.quant = e.target.value; refresh(); }
    else if (f === "kvBits")  { m.kvBits = parseInt(e.target.value, 10) || 0; refresh(); }
    else if (f === "context") { m.context = parseInt(e.target.value, 10); refresh(); }
    else if (f === "role")    { m.role = e.target.value; refresh(); }
    else if (f === "preset")  { applyPreset(m, e.target.value); renderModels(); refresh(); }
    else if (f === "name")    { if (!m.name.trim()) { m.name = "Model " + m.id; e.target.value = m.name; refresh(); } }
    else if (NUM_LIMITS[f])   { e.target.value = m[f]; }
  });

  $("models").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act=del]");
    if (!btn || S.models.length <= 1) return;
    var m = findModel(btn);
    S.models = S.models.filter(function (x) { return x !== m; });
    renderModels();
    refresh();
  });

  function applyPreset(m, id) {
    m.preset = id;
    var p = PRESETS.filter(function (x) { return x.id === id; })[0];
    if (!p || id === "manual") return;
    m.params = p.params;
    m.activeParams = p.activeParams || 0;
    m.role = p.role || "decoder";
    // Preset podaje tylko to, co niezerowe — reszta wraca do wartości neutralnych,
    // żeby po przełączeniu nie zostały warstwy lokalne z poprzedniego modelu.
    m.fullLayers   = p.fullLayers   || 0;
    m.kvHeads      = p.kvHeads      || 8;
    m.headDim      = p.headDim      || 128;
    m.localLayers  = p.localLayers  || 0;
    m.localKvHeads = p.localKvHeads || 8;
    m.window       = p.window       || 4096;
    // nadpisujemy tylko nazwy domyślne, nigdy tych nadanych przez użytkownika
    if (!m.name.trim() || /^Model \d+$/.test(m.name)) m.name = presetName(p);
  }

  $("add").addEventListener("click", function () {
    var id = S.models.reduce(function (a, m) { return Math.max(a, m.id); }, 0) + 1;
    S.models.push(mk(id, "Model " + id, "qwen3-8", "Q4_K_M", 8192));
    renderModels();
    refresh();
    var last = $("models").lastElementChild;
    if (last) { last.scrollIntoView({ block: "nearest" }); last.querySelector("[data-f=name]").focus(); }
  });

  $("reset").addEventListener("click", function () {
    S = defaults();
    syncGlobals(); renderModels(); refresh();
    flash(t("flash.restored"));
  });

  $("copy").addEventListener("click", function () {
    var r = compute();
    var out = ["VRTX Checker — " + gpuName(r.g),
               t("copy.limit", fmtLimit(r.g.vram), kvLabel(S.kvBits)), ""];
    r.rows.forEach(function (row) {
      out.push(t("copy.model", row.m.name, numStr(row.m.params), row.m.quant,
                 kvLabel(row.kvBits), row.kvInherited ? "" : "*", row.m.context / 1024));
      out.push(t("copy.line", fmt(row.weights),
                 row.m.role === "encoder" ? fmt(0) : fmt(row.kv),
                 fmt(row.over), fmt(row.total)) +
               (row.tps ? t("copy.tps", Math.round(row.tps)) : ""));
    });
    if (r.rows.some(function (row) { return !row.kvInherited; })) {
      out.push("", t("copy.note"));
    }
    out.push("", t("copy.sys", fmt(r.os), fmt(r.frag)),
             t("copy.total", fmt(r.total, 1), fmtLimit(r.g.vram)));
    var txt = out.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { flash(t("flash.copied")); },
                                             function () { flash(t("flash.copyBlocked")); });
    } else { flash(t("flash.copyNone")); }
  });

  /* ============ zdarzenia: ustawienia globalne ============ */

  var gsel = $("gpu");
  function fillGpus() {
    gsel.textContent = "";
    GPUS.forEach(function (g) { gsel.appendChild(new Option(gpuName(g), g.id)); });
    gsel.value = S.gpu;
  }
  fillGpus();

  gsel.addEventListener("change", function () {
    S.gpu = gsel.value;
    $("custom-wrap").hidden = S.gpu !== "custom";
    refresh();
  });
  $("custom-vram").addEventListener("input", function () {
    S.customVram = clamp(num(this.value, S.customVram), 1, 1024);
    refresh();
  });
  $("custom-vram").addEventListener("change", function () { this.value = S.customVram; });
  function fillKvPrec() {
    var el = $("kv-prec");
    el.textContent = "";
    KV_PREC.forEach(function (p) { el.appendChild(new Option(t("kv." + p.bits), String(p.bits))); });
    el.value = String(S.kvBits);
  }
  fillKvPrec();
  // Zmiana domyślnej precyzji przerysowuje karty — etykieta "Jak globalnie — …"
  // na każdej z nich musi pokazać nową wartość.
  $("kv-prec").addEventListener("change", function () {
    S.kvBits = parseInt(this.value, 10);
    renderModels(); refresh();
  });
  $("os-preset").addEventListener("change", function () { S.os = parseFloat(this.value); refresh(); });
  $("proc-ov").addEventListener("input", function () { S.proc = clamp(num(this.value, S.proc), 0, 4); refresh(); });
  $("proc-ov").addEventListener("change", function () { this.value = S.proc; });
  $("frag").addEventListener("change", function () { S.frag = parseFloat(this.value); refresh(); });

  // Nazwa modelu jest danymi użytkownika, więc normalnie jej nie ruszamy.
  // Wyjątkiem są nazwy, których użytkownik nigdy nie tknął — domyślne z defaults()
  // i te wzięte z presetu. Bez tego po przełączeniu na EN zostawałyby polskie.
  function retranslateNames(from, to) {
    var defKeys = ["def.chat", "def.vision", "def.emb"];
    S.models.forEach(function (m) {
      for (var i = 0; i < defKeys.length; i++) {
        if (m.name === I18N[from][defKeys[i]]) { m.name = I18N[to][defKeys[i]]; return; }
      }
      var key = "preset." + m.preset;
      if (I18N[from][key] !== undefined && m.name === I18N[from][key]) m.name = I18N[to][key];
    });
  }

  function setLang(lang) {
    if (!I18N[lang] || lang === LANG) return;
    retranslateNames(LANG, lang);
    LANG = lang;
    S.lang = lang;
    document.documentElement.lang = t("lang.html");
    Array.prototype.forEach.call($("lang").querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    applyI18nIn(null);
    fillKvPrec(); fillGpus();
    syncGlobals(); renderModels(); renderResults(); save();
  }

  $("lang").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-lang]");
    if (btn) setLang(btn.getAttribute("data-lang"));
  });

  function syncGlobals() {
    gsel.value = S.gpu;
    $("custom-wrap").hidden = S.gpu !== "custom";
    $("custom-vram").value = S.customVram;
    $("kv-prec").value = String(S.kvBits);
    $("os-preset").value = String(S.os);
    $("proc-ov").value = S.proc;
    $("frag").value = String(S.frag);
  }

  /* ============ szew testowy ============ */
  // Udostępnia rdzeń obliczeniowy dla test-vram.mjs. Nie zmienia zachowania UI —
  // testy mają liczyć tym samym kodem, który działa w przeglądarce.
  globalThis.__vram = {
    kvGiB: kvGiB, weightsGiB: weightsGiB, tokensPerSec: tokensPerSec,
    compute: compute, mk: mk, defaults: defaults, effKvBits: effKvBits,
    QUANT: QUANT, PRESETS: PRESETS, GPUS: GPUS, CONTEXTS: CONTEXTS, BW_EFF: BW_EFF,
    KV_PREC: KV_PREC, KV_BITS: KV_BITS, FP8_ARCH: FP8_ARCH,
    I18N: I18N, t: t, setLang: setLang, lang: function () { return LANG; },
    state: function () { return S; },
    load: function (st) { S = st; syncGlobals(); renderModels(); renderResults(); }
  };

  /* ============ start ============ */
  document.documentElement.lang = t("lang.html");
  Array.prototype.forEach.call($("lang").querySelectorAll("[data-lang]"), function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false");
  });
  applyI18nIn(null);
  syncGlobals();
  renderModels();
  renderResults();
})();
</script>
</body>
</html>
